name: Pull org events

on:
  workflow_dispatch:
    inputs:
      test_accounts:
        description: "Test mode: how many accounts to check (0 = full run)"
        default: "10"
      run_kind:
        description: "Leave blank, or type monday (all accounts) or tier1"
        default: ""
  # AFTER upgrading Apify to Starter, delete the # at the start of the next 2 lines.
  # schedule:
  #   - cron: "0 12 * * 1,3,5"   # Mon/Wed/Fri 7 a.m. Central (6 a.m. in winter)

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull posts and find events
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_ACCOUNTS: ${{ github.event.inputs.test_accounts || '0' }}
          RUN_KIND: ${{ github.event.inputs.run_kind }}
        run: python pipeline.py
      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Update events $(date -u +%Y-%m-%d)"
          git push
